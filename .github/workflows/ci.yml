name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev tools (Vitest, TypeScript, ESLint) need Node 22.12+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run test:dist
      - run: npm run check:package
      - name: Upload build output
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The package promises to work on Node 18+ ("engines"). The dev tools
  # can't run that far back, so check the *built* package there instead.
  compat:
    name: Built package on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Only React is needed (for the react entry point). `npm install` would
      # also install every dev tool, which can't run on these versions, so
      # unpack just React, which has no dependencies of its own.
      - name: Install React only
        run: |
          npm pack react@19 --pack-destination "$RUNNER_TEMP"
          mkdir -p node_modules/react
          tar -xzf "$RUNNER_TEMP"/react-*.tgz -C node_modules/react --strip-components=1
      - run: node scripts/smoke-test.js
